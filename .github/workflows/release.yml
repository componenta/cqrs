name: Verify and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      # Development verification uses a pinned DI 6 source snapshot until the
      # dependency is released. Release verification MUST use stable packages.
      - name: Checkout DI 6 for development verification
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: 2361c398fc938108de67df8ec6a723bf4c4648ff
          path: .ci/di6
          persist-credentials: false
      - name: Allow the pinned development dependency in CI only
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        shell: bash
        run: |
          git -C .ci/di6 rev-parse HEAD
          composer config repositories.di6 '{"type":"path","url":".ci/di6","options":{"symlink":false,"versions":{"componenta/di":"6.0.x-dev"}}}'
          composer require 'componenta/di:^6.0@dev' --no-update --no-interaction
      - run: composer install --no-interaction --prefer-dist
      - run: composer show componenta/di
      - run: composer test
      - run: composer analyse
      - name: Measure baseline and candidate with the same dependencies
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'perf:')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/cqrs-baseline"
          git archive "$BASE_SHA" src | tar -x -C "$RUNNER_TEMP/cqrs-baseline"
          echo '=== Baseline source ==='
          CQRS_BENCH_SOURCE="$RUNNER_TEMP/cqrs-baseline/src" composer bench
          echo '=== Candidate source ==='
          composer bench
      - name: Verify benchmark suite
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bench:')
        run: composer bench

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
