name: Verify and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      # Development verification uses pinned DI 6 and Config 4 compatible Identity
      # snapshots until those dependencies are released. Release verification MUST use stable packages.
      - name: Checkout DI 6 for development verification
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: ded9a6dc44db2775c4753e73d9581d70caac6043
          path: .ci/di6
          persist-credentials: false
      - name: Checkout Config 4 compatible Identity
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        uses: actions/checkout@v7
        with:
          repository: componenta/identity
          ref: 3feb94e0d64956ecdf7b22abed4a8bd9f597abeb
          path: .ci/identity
          persist-credentials: false
      - name: Expose the declared development branch aliases
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        shell: bash
        run: |
          git -C .ci/di6 switch --create fix/callback-dependency-baseline-2026-11-26
          git -C .ci/identity switch --create fix/callback-dependency-baseline-2026-11-26
      - name: Allow the pinned development dependency in CI only
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        shell: bash
        run: |
          php .github/prepare-development-dependencies.php "$PWD" "$PWD/.ci"
      - run: composer install --no-interaction --prefer-dist
      - run: composer show componenta/di
      # Dev tooling (PHPBench) still pulls abandoned doctrine/annotations.
      # Keep advisory/malware checks strict and report dev maintenance warnings.
      - run: composer audit --locked --abandoned=report --no-interaction
      - run: composer audit --locked --no-dev --abandoned=fail --no-interaction
      - run: composer test
      - run: composer analyse
      - run: composer test:negative
      - name: Measure comparable baseline and candidate
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'perf:')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A benchmark-base trailer can select an older, compatible source revision.
          override="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -nE 's/^Benchmark-base: ([0-9a-f]{40})$/\1/p')"
          if [ -n "$override" ]; then BASE_SHA="$override"; fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          set -euo pipefail
          baseline="$(mktemp -d "$RUNNER_TEMP/cqrs-baseline.XXXXXX")"
          trap 'rm -rf "$baseline"' EXIT
          if git diff --quiet "$BASE_SHA" HEAD -- composer.json benchmarks phpbench.json.dist; then
            # Identical dependencies and fixtures: reuse the candidate vendor.
            git archive "$BASE_SHA" src | tar -x -C "$baseline"
            CQRS_BENCH_SOURCE="$baseline/src" composer bench | tee "$RUNNER_TEMP/cqrs-baseline.log"
            php benchmarks/check-report.php "$RUNNER_TEMP/cqrs-baseline.log"
          else
            # A changed dependency or benchmark fixture requires its own checkout.
            git archive "$BASE_SHA" | tar -x -C "$baseline"
            if [ -d .ci/di6 ]; then
              php .github/prepare-development-dependencies.php "$baseline" "$GITHUB_WORKSPACE/.ci"
            fi
            composer install --working-dir="$baseline" --no-interaction --prefer-dist
            php benchmarks/compare-dependencies.php "$baseline/composer.lock" composer.lock
            echo "=== Baseline: $BASE_SHA ==="
            composer --working-dir="$baseline" bench | tee "$RUNNER_TEMP/cqrs-baseline.log"
            php "$baseline/benchmarks/check-report.php" "$RUNNER_TEMP/cqrs-baseline.log"
          fi
          echo "=== Candidate: $GITHUB_SHA ==="
          composer bench | tee "$RUNNER_TEMP/cqrs-candidate.log"
          php benchmarks/check-report.php "$RUNNER_TEMP/cqrs-candidate.log"
      - name: Verify benchmark suite
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bench:')
        shell: bash
        run: |
          set -o pipefail
          composer bench | tee "$RUNNER_TEMP/cqrs-benchmark.log"
          php benchmarks/check-report.php "$RUNNER_TEMP/cqrs-benchmark.log"

  consumer:
    name: Production consumer (PHP 8.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
          tools: composer:v2
      - name: Checkout DI 6 for development verification
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: ded9a6dc44db2775c4753e73d9581d70caac6043
          path: .ci/di6
          persist-credentials: false
      - name: Checkout Config 4 compatible Identity
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        uses: actions/checkout@v7
        with:
          repository: componenta/identity
          ref: 3feb94e0d64956ecdf7b22abed4a8bd9f597abeb
          path: .ci/identity
          persist-credentials: false
      - name: Expose the declared development branch aliases
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
        shell: bash
        run: |
          git -C .ci/di6 switch --create fix/callback-dependency-baseline-2026-11-26
          git -C .ci/identity switch --create fix/callback-dependency-baseline-2026-11-26
      - name: Install production dependencies in an isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d "$RUNNER_TEMP/cqrs-consumer.XXXXXX")"
          trap 'rm -rf "$workspace"' EXIT
          mkdir "$workspace/consumer"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$workspace/package"
          git -C "$workspace/package" switch --force-create fix/callback-dependency-baseline-2026-11-26 "$GITHUB_SHA"
          cat > "$workspace/consumer/composer.json" <<'JSON'
          {
            "require": {"componenta/cqrs": "^5.0@dev"},
            "repositories": {
              "cqrs": {
                "type": "path",
                "url": "../package",
                "options": {"symlink": false}
              }
            },
            "minimum-stability": "stable",
            "prefer-stable": true
          }
          JSON
          if [ -d .ci/di6 ]; then
            php .github/prepare-development-dependencies.php "$workspace/consumer" "$GITHUB_WORKSPACE/.ci"
          fi
          composer update --working-dir="$workspace/consumer" --no-dev --prefer-lowest --prefer-stable --no-interaction --prefer-dist
          composer audit --working-dir="$workspace/consumer" --locked --no-dev --no-interaction
          php tests/consumer-smoke.php "$workspace/consumer/vendor/autoload.php"

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [verify, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
